<svg viewBox="0 0 900 1730" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>แผนผังการทำงาน ESP8266 HX711</title>
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#374151"/>
    </marker>
  </defs>
  <style>
    text { font-family: Sarabun,'Noto Sans Thai','TH Sarabun New',Arial,sans-serif; fill:#1e293b; }
    .sh { fill:#fff; stroke:#1d4ed8; stroke-width:2.5; }
    .ln { stroke:#374151; stroke-width:2; fill:none; }
    .ar { stroke:#374151; stroke-width:2; fill:none; marker-end:url(#arr); }
    .lb { text-anchor:middle; dominant-baseline:middle; font-size:18; }
    .sb { text-anchor:middle; dominant-baseline:middle; font-size:15; fill:#374151; }
    .tg { font-size:14; fill:#374151; text-anchor:middle; }
  </style>

  <rect width="900" height="1730" fill="#f8fafc"/>
  <text x="450" y="32" text-anchor="middle" font-size="20" font-weight="bold">แผนผังการทำงาน — ESP8266 อ่านค่าจาก HX711</text>

  <!-- 1. เริ่มต้น -->
  <rect x="320" y="50" width="260" height="62" rx="31" class="sh"/>
  <text x="450" y="81" class="lb" font-weight="bold">เริ่มต้น</text>
  <line x1="450" y1="112" x2="450" y2="140" class="ar"/>

  <!-- 2. เปิดพอร์ต Serial -->
  <rect x="250" y="140" width="400" height="76" class="sh"/>
  <text x="450" y="166" class="lb">เปิดพอร์ต Serial (115200 บอด)</text>
  <text x="450" y="194" class="sb">หน่วงเวลา 500 มิลลิวินาที</text>
  <line x1="450" y1="216" x2="450" y2="244" class="ar"/>

  <!-- 3. แสดงข้อมูลขา (Data I/O parallelogram) -->
  <polygon points="240,244 660,244 628,296 208,296" class="sh"/>
  <text x="434" y="263" class="lb">แสดงข้อความเริ่มต้นและหมายเลขขา</text>
  <text x="434" y="283" class="sb">DOUT=GPIO14 (D5)  SCK=GPIO12 (D6)</text>
  <line x1="450" y1="296" x2="450" y2="324" class="ar"/>

  <!-- 4. กำหนดขา GPIO (Predefined Process) -->
  <rect x="250" y="324" width="400" height="76" class="sh"/>
  <line x1="266" y1="324" x2="266" y2="400" stroke="#1d4ed8" stroke-width="2.5"/>
  <line x1="634" y1="324" x2="634" y2="400" stroke="#1d4ed8" stroke-width="2.5"/>
  <text x="450" y="352" class="lb">กำหนดขา GPIO และเริ่มต้น HX711</text>
  <text x="450" y="379" class="sb">DOUT=ขาเข้า, SCK=ขาออก</text>
  <line x1="450" y1="400" x2="450" y2="428" class="ar"/>

  <!-- 5. แสดงเริ่มต้นเสร็จ (Data I/O) -->
  <polygon points="240,428 660,428 628,480 208,480" class="sh"/>
  <text x="434" y="454" class="lb">แสดง "เริ่มต้นเสร็จแล้ว"</text>
  <line x1="450" y1="480" x2="450" y2="508" class="ar"/>

  <!-- 6. Off-page [ก] -->
  <polygon points="370,508 530,508 530,544 450,560 370,544" class="sh"/>
  <text x="450" y="526" class="lb" font-weight="bold" fill="#dc2626">ก</text>
  <line x1="450" y1="560" x2="450" y2="588" class="ar"/>

  <!-- 7. Decision: เวลาน้อยกว่า 500ms? -->
  <polygon points="450,588 660,676 450,764 240,676" class="sh"/>
  <text x="450" y="666" class="lb">เวลาผ่านน้อยกว่า 500 มิลลิวินาที?</text>
  <text x="450" y="688" class="sb">(ยังไม่ถึงรอบถัดไป)</text>

  <!-- ใช่ → off-page [ก] ขวา -->
  <line x1="660" y1="676" x2="726" y2="676" class="ar"/>
  <text x="693" y="662" class="tg">ใช่</text>
  <polygon points="726,658 866,658 866,694 796,710 726,694" class="sh"/>
  <text x="796" y="676" class="lb" font-weight="bold" fill="#dc2626">ก</text>

  <!-- ไม่ใช่ → ลง -->
  <line x1="450" y1="764" x2="450" y2="792" class="ar"/>
  <text x="474" y="780" class="tg" text-anchor="start">ไม่ใช่</text>

  <!-- 8. บันทึกเวลา -->
  <rect x="250" y="792" width="400" height="72" class="sh"/>
  <text x="450" y="828" class="lb">บันทึกเวลาปัจจุบัน</text>
  <line x1="450" y1="864" x2="450" y2="892" class="ar"/>

  <!-- 9. อ่านขา DOUT -->
  <rect x="250" y="892" width="400" height="72" class="sh"/>
  <text x="450" y="928" class="lb">อ่านสถานะขา DOUT</text>
  <line x1="450" y1="964" x2="450" y2="992" class="ar"/>

  <!-- 10. ตรวจสอบ HX711 (Predefined Process) -->
  <rect x="250" y="992" width="400" height="72" class="sh"/>
  <line x1="266" y1="992" x2="266" y2="1064" stroke="#1d4ed8" stroke-width="2.5"/>
  <line x1="634" y1="992" x2="634" y2="1064" stroke="#1d4ed8" stroke-width="2.5"/>
  <text x="450" y="1028" class="lb">ตรวจสอบว่า HX711 พร้อมหรือไม่</text>
  <line x1="450" y1="1064" x2="450" y2="1092" class="ar"/>

  <!-- 11. แสดงสถานะ (Data I/O) -->
  <polygon points="240,1092 660,1092 628,1144 208,1144" class="sh"/>
  <text x="434" y="1118" class="lb">แสดงสถานะขา DOUT และสถานะพร้อม</text>
  <line x1="450" y1="1144" x2="450" y2="1172" class="ar"/>

  <!-- 12. Decision: HX711 พร้อม? -->
  <polygon points="450,1172 640,1256 450,1340 260,1256" class="sh"/>
  <text x="450" y="1256" class="lb">HX711 พร้อมอ่านค่า?</text>

  <!-- ใช่ → ซ้าย -->
  <line x1="260" y1="1256" x2="140" y2="1256" class="ln"/>
  <line x1="140" y1="1256" x2="140" y2="1370" class="ar"/>
  <text x="202" y="1242" class="tg">ใช่</text>

  <!-- ไม่ใช่ → ขวา -->
  <line x1="640" y1="1256" x2="760" y2="1256" class="ln"/>
  <line x1="760" y1="1256" x2="760" y2="1540" class="ln"/>
  <text x="703" y="1242" class="tg">ไม่ใช่</text>

  <!-- 12a. อ่านค่าดิบ (Predefined Process) -->
  <rect x="40" y="1370" width="200" height="68" class="sh"/>
  <line x1="56" y1="1370" x2="56" y2="1438" stroke="#1d4ed8" stroke-width="2.5"/>
  <line x1="224" y1="1370" x2="224" y2="1438" stroke="#1d4ed8" stroke-width="2.5"/>
  <text x="140" y="1404" class="lb">อ่านค่าดิบจาก HX711</text>
  <line x1="140" y1="1438" x2="140" y2="1466" class="ar"/>

  <!-- 12b. แสดงค่าดิบ (Data I/O) -->
  <polygon points="40,1466 240,1466 222,1510 22,1510" class="sh"/>
  <text x="131" y="1488" class="lb">แสดงค่าดิบ</text>

  <!-- รวมเส้น -->
  <line x1="140" y1="1510" x2="140" y2="1540" class="ln"/>
  <line x1="140" y1="1540" x2="449" y2="1540" class="ln"/>
  <line x1="760" y1="1540" x2="451" y2="1540" class="ln"/>
  <line x1="450" y1="1540" x2="450" y2="1568" class="ar"/>

  <!-- 13. ส่งออก Serial (Data I/O) -->
  <polygon points="240,1568 660,1568 628,1620 208,1620" class="sh"/>
  <text x="434" y="1594" class="lb">ส่งออกทาง Serial และขึ้นบรรทัดใหม่</text>
  <line x1="450" y1="1620" x2="450" y2="1648" class="ar"/>

  <!-- 14. Off-page [ก] -->
  <polygon points="370,1648 530,1648 530,1684 450,1700 370,1684" class="sh"/>
  <text x="450" y="1666" class="lb" font-weight="bold" fill="#dc2626">ก</text>

  <!-- คำอธิบาย -->
  <text x="450" y="1718" text-anchor="middle" font-size="13" fill="#94a3b8">ออฟเพจ [ก] = วนซ้ำ | กล่องเส้นคู่ = กระบวนการย่อย | สี่เหลี่ยมเอียง = ข้อมูลเข้า-ออก | ขนมเปียกปูน = เงื่อนไข</text>
</svg>
